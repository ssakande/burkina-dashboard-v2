<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Humanitaire - Burkina Faso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .leaflet-container { z-index: 1; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { border: 4px solid #E0E7FF; border-top: 4px solid #6366F1; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="loading-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#EFF6FF,#E0E7FF);display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div style="text-align:center;background:white;padding:40px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.1);max-width:400px;">
            <div class="spinner"></div>
            <h2 style="color:#1F2937;font-size:20px;margin:10px 0;">Chargement du Dashboard</h2>
            <p id="loading-status" style="color:#6B7280;font-size:14px;">Initialisation...</p>
        </div>
    </div>

    <div id="root"></div>

    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <script>
        const loadingStatus = document.getElementById('loading-status');
        let checks = 0;

        function check() {
            checks++;
            const react = typeof React !== 'undefined';
            const reactdom = typeof ReactDOM !== 'undefined';
            const babel = typeof Babel !== 'undefined';
            const leaflet = typeof L !== 'undefined';
            const chartjs = typeof Chart !== 'undefined';
            const loaded = [react, reactdom, babel, leaflet, chartjs].filter(Boolean).length;
            loadingStatus.textContent = `Bibliothèques: ${loaded}/5`;
            if (react && reactdom && babel && leaflet && chartjs) {
                loadingStatus.textContent = 'Chargement de l\'application...';
                loadApp();
            } else if (checks < 20) {
                setTimeout(check, 500);
            } else {
                const missing = [];
                if (!react) missing.push('React');
                if (!leaflet) missing.push('Leaflet');
                if (!chartjs) missing.push('Chart.js');
                document.getElementById('loading-screen').innerHTML = `
                    <div style="background:white;padding:40px;border-radius:16px;max-width:400px;text-align:center;">
                        <div style="font-size:40px;">⚠️</div>
                        <h2 style="color:#DC2626;">Erreur de chargement</h2>
                        <p style="color:#6B7280;">Impossible de charger: ${missing.join(', ')}</p>
                        <button onclick="location.reload()" style="background:#6366F1;color:white;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-size:16px;margin-top:16px;">
                            Réessayer
                        </button>
                    </div>`;
            }
        }

        function loadApp() {
            const s = document.createElement('script');
            s.type = 'text/babel';
            s.src = './burkina-dashboard.jsx';
            s.onload = () => setTimeout(() => {
                try {
                    ReactDOM.createRoot(document.getElementById('root')).render(
                        React.createElement(React.StrictMode, null, React.createElement(BurkinaDashboard))
                    );
                    setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; }, 500);
                } catch(e) {
                    document.getElementById('loading-status').textContent = 'Erreur: ' + e.message;
                }
            }, 1000);
            s.onerror = () => { loadingStatus.textContent = 'Erreur: burkina-dashboard.jsx introuvable'; };
            document.body.appendChild(s);
        }

        setTimeout(check, 1000);
    </script>
</body>
</html>
