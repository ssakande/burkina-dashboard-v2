<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Humanitaire - Burkina Faso</title>
    
    <!-- Tailwind CSS (seul CDN conservé - léger et fiable) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS - FICHIER LOCAL -->
    <link rel="stylesheet" href="./libs/leaflet.css" />
    
    <style>
        body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .spinner { border:4px solid #E0E7FF; border-top:4px solid #6366F1; border-radius:50%; width:60px; height:60px; animation:spin 1s linear infinite; margin:0 auto 20px; }
        ::-webkit-scrollbar { width:8px; }
        ::-webkit-scrollbar-thumb { background:#888; border-radius:4px; }
    </style>
</head>
<body>
    <div id="loading-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#EFF6FF,#E0E7FF);display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div style="text-align:center;background:white;padding:40px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.1);max-width:420px;width:90%;">
            <div class="spinner"></div>
            <h2 style="color:#1F2937;font-size:20px;margin:10px 0;">Chargement du Dashboard</h2>
            <p id="loading-status" style="color:#6B7280;font-size:14px;margin:8px 0;">Initialisation...</p>
            <div id="error-box" style="display:none;margin-top:16px;padding:16px;background:#FEF2F2;border-radius:8px;text-align:left;">
                <p style="color:#DC2626;font-weight:bold;margin:0 0 8px;">❌ Erreur de chargement</p>
                <p id="error-text" style="color:#7F1D1D;font-size:13px;margin:0 0 12px;"></p>
                <p style="color:#6B7280;font-size:12px;margin:0 0 4px;"><strong>Vérifiez que le dossier libs/ contient :</strong></p>
                <code style="font-size:11px;color:#374151;display:block;background:#F3F4F6;padding:8px;border-radius:4px;">
                    libs/react.min.js<br>
                    libs/react-dom.min.js<br>
                    libs/babel.min.js<br>
                    libs/leaflet.js<br>
                    libs/leaflet.css<br>
                    libs/chart.min.js
                </code>
                <button onclick="location.reload()" style="margin-top:12px;background:#6366F1;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;width:100%;">
                    🔄 Réessayer
                </button>
            </div>
        </div>
    </div>

    <div id="root"></div>

    <!-- BIBLIOTHÈQUES LOCALES - aucune dépendance CDN -->
    <script src="./libs/react.min.js"></script>
    <script src="./libs/react-dom.min.js"></script>
    <script src="./libs/babel.min.js"></script>
    <script src="./libs/leaflet.js"></script>
    <script src="./libs/chart.min.js"></script>

    <script>
        const statusEl = document.getElementById('loading-status');
        const errorBox = document.getElementById('error-box');
        const errorText = document.getElementById('error-text');
        let attempts = 0;

        function setStatus(msg) {
            statusEl.textContent = msg;
            console.log('[Dashboard]', msg);
        }

        function showError(msg) {
            errorBox.style.display = 'block';
            errorText.textContent = msg;
            statusEl.textContent = '';
            console.error('[Dashboard Error]', msg);
        }

        function checkLibraries() {
            attempts++;
            
            const status = {
                React:    typeof React    !== 'undefined',
                ReactDOM: typeof ReactDOM !== 'undefined',
                Babel:    typeof Babel    !== 'undefined',
                Leaflet:  typeof L        !== 'undefined',
                ChartJS:  typeof Chart    !== 'undefined',
            };

            const loaded = Object.values(status).filter(Boolean).length;
            const total  = Object.keys(status).length;

            setStatus(`Bibliothèques chargées : ${loaded} / ${total}`);

            if (loaded === total) {
                setStatus('Lancement de l\'application...');
                setTimeout(startApp, 300);
                return;
            }

            if (attempts >= 30) {
                const missing = Object.entries(status)
                    .filter(([,v]) => !v)
                    .map(([k]) => k)
                    .join(', ');
                showError(`Fichiers manquants dans libs/ : ${missing}`);
                return;
            }

            setTimeout(checkLibraries, 500);
        }

        function startApp() {
            setStatus('Compilation JSX...');
            const script = document.createElement('script');
            script.type = 'text/babel';
            script.src = './burkina-dashboard.jsx';
            script.onload = () => {
                setTimeout(() => {
                    try {
                        if (typeof BurkinaDashboard === 'undefined') {
                            throw new Error('BurkinaDashboard introuvable dans burkina-dashboard.jsx');
                        }
                        ReactDOM.createRoot(document.getElementById('root')).render(
                            React.createElement(React.StrictMode, null,
                                React.createElement(BurkinaDashboard)
                            )
                        );
                        document.getElementById('loading-screen').style.display = 'none';
                    } catch(e) {
                        showError(e.message);
                    }
                }, 1200);
            };
            script.onerror = () => showError('Fichier burkina-dashboard.jsx introuvable.');
            document.body.appendChild(script);
        }

        // Démarrer les vérifications après chargement du DOM
        window.addEventListener('load', () => setTimeout(checkLibraries, 500));
    </script>
</body>
</html>
